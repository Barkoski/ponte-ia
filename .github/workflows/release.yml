name: Publicar release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Criar checksums e publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace "^v", ""
          } else {
            $version = $env:GITHUB_REF_NAME -replace "^release/v", ""
            $tag = "v$version"
          }
          $executables = @(Get-ChildItem -Path dist -Filter *.exe)
          if ($executables.Count -lt 2) {
            throw "Os dois executáveis esperados não foram gerados."
          }

          $checksums = foreach ($file in $executables) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashFile = Join-Path $PWD "dist/SHA256SUMS.txt"
          Set-Content -Path $hashFile -Value $checksums -Encoding utf8

          $assets = @($executables | ForEach-Object { $_.FullName })
          $assets += $hashFile
          $notes = ".github/release-notes/$version.md"
          if (Test-Path $notes) {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Ponte IA $tag" --notes-file $notes
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Ponte IA $tag" --generate-notes
          }
